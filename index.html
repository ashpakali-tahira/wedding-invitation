<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Makandar Family Wedding Invitation | Ashpakali & Tahira</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Cinzel+Decorative:wght@400;700;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Amiri:ital,wght@0,400;0,700;1,400&family=Great+Vibes&display=swap" rel="stylesheet">
    
    <!-- QRCode.js for 100% Real Scannable Venue QR Codes -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <!-- Tailwind Configuration -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        palace: {
                            emerald: '#062317',
                            deep: '#03120b',
                            jade: '#0b3b27',
                            gold: '#d4af37',
                            goldLight: '#fbe8a6',
                            goldDark: '#8c6914',
                            ivory: '#fdfaf3',
                            parchment: '#f6eedc',
                            sand: '#e8dec8'
                        }
                    },
                    fontFamily: {
                        serif: ['"Cormorant Garamond"', 'serif'],
                        display: ['"Cinzel Decorative"', 'cursive'],
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                        arabic: ['"Amiri"', 'serif'],
                        script: ['"Great Vibes"', 'cursive']
                    }
                }
            }
        }
    </script>

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: #03120b;
            color: #fdfaf3;
            overflow-x: hidden;
            scroll-behavior: smooth;
        }
        body.doors-locked {
            overflow: hidden;
            height: 100vh;
        }

        /* =========================================================
           1. SUPER-REALISTIC 3D PALACE DOORS (STRICTLY ZERO TEXT)
           ========================================================= */
        #door-scene-overlay {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: radial-gradient(circle at 50% 45%, #1d140b 0%, #090603 70%, #020100 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            perspective: 2400px;
            overflow: hidden;
            transition: opacity 1.1s cubic-bezier(0.4, 0, 0.2, 1), visibility 1.1s;
            cursor: pointer;
        }
        #door-scene-overlay.opened-hidden {
            opacity: 0 !important;
            visibility: hidden !important;
            pointer-events: none !important;
            display: none !important;
        }
        *::before, *::after {
            pointer-events: none;
        }

        /* Architectural Stone & Gold Archway Surround */
        .archway-surround {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: 
                radial-gradient(circle at 50% 18%, rgba(255, 212, 118, 0.18) 0%, transparent 58%),
                repeating-linear-gradient(90deg, rgba(255,255,255,0.014) 0px, rgba(255,255,255,0.014) 2px, transparent 2px, transparent 14px),
                linear-gradient(180deg, #140f0a 0%, #241a10 45%, #0e0a06 100%);
            box-shadow: inset 0 0 150px rgba(0,0,0,0.95);
            transform-style: preserve-3d;
            transition: transform 2.1s cubic-bezier(0.22, 1, 0.36, 1);
        }
        #door-scene-overlay.opening .archway-surround {
            transform: scale(1.36) translateZ(260px);
        }

        /* Warm Golden Palace Interior Light Behind Doors */
        .interior-light-glow {
            position: absolute;
            width: min(88vw, 660px);
            height: min(92vh, 920px);
            border-radius: 330px 330px 8px 8px;
            background: radial-gradient(circle at 50% 45%, #fffdf0 0%, #fce088 34%, #d4941c 68%, #3d2204 100%);
            box-shadow: 
                0 0 90px 25px rgba(255, 215, 100, 0.45),
                inset 0 0 80px rgba(255, 255, 255, 0.85);
            opacity: 0.28;
            transition: opacity 1.5s ease, transform 1.9s ease, box-shadow 1.5s ease;
            pointer-events: none;
            z-index: 1;
        }
        #door-scene-overlay.opening .interior-light-glow {
            opacity: 1;
            transform: scale(1.16);
            box-shadow: 0 0 240px 100px rgba(255, 226, 136, 0.96);
        }

        /* Carved Arch Frame */
        .door-frame-arch {
            position: relative;
            width: min(88vw, 660px);
            height: min(92vh, 920px);
            border-radius: 330px 330px 6px 6px;
            padding: 16px 16px 0 16px;
            background: linear-gradient(135deg, #5c431c 0%, #cfa446 25%, #3d2b10 50%, #e6c065 75%, #3b280d 100%);
            box-shadow: 
                0 25px 85px rgba(0,0,0,0.96),
                0 0 0 12px #1a1209,
                0 0 0 16px #63491f,
                inset 0 8px 25px rgba(0,0,0,0.9);
            display: flex;
            align-items: stretch;
            justify-content: center;
            transform-style: preserve-3d;
            z-index: 5;
        }

        .door-jamb-inner {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 314px 314px 2px 2px;
            box-shadow: inset 0 15px 45px rgba(0,0,0,0.95);
            display: flex;
            transform-style: preserve-3d;
            perspective: 2200px;
        }

        /* Center Light Seam & Subtle Golden Handle Halo (No Text) */
        .center-light-seam {
            position: absolute;
            top: 2%;
            bottom: 0;
            left: 50%;
            width: 3px;
            transform: translateX(-50%);
            background: linear-gradient(180deg, transparent 0%, rgba(255, 232, 150, 0.95) 20%, #fff9db 50%, rgba(255, 232, 150, 0.95) 80%, transparent 100%);
            box-shadow: 0 0 20px 5px rgba(255, 214, 98, 0.8);
            z-index: 15;
            transition: opacity 0.4s ease;
            pointer-events: none;
        }
        #door-scene-overlay.opening .center-light-seam {
            opacity: 0;
        }

        /* Subtle Non-Text Glowing Golden Halo Around Center Knockers */
        .handle-touch-halo {
            position: absolute;
            top: 54%;
            left: 50%;
            width: 150px;
            height: 150px;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 225, 125, 0.32) 0%, rgba(212, 175, 55, 0.12) 45%, transparent 72%);
            box-shadow: 0 0 35px rgba(255, 215, 90, 0.35);
            z-index: 22;
            pointer-events: none;
            animation: haloBreathe 2.6s infinite ease-in-out;
            transition: opacity 0.4s ease;
        }
        #door-scene-overlay.opening .handle-touch-halo {
            opacity: 0;
        }
        @keyframes haloBreathe {
            0%, 100% { transform: translate(-50%, -50%) scale(0.92); opacity: 0.65; }
            50% { transform: translate(-50%, -50%) scale(1.12); opacity: 1; }
        }

        /* Individual 3D Wooden Door Leaf */
        .palace-door-leaf {
            position: relative;
            width: 50%;
            height: 100%;
            transform-style: preserve-3d;
            transition: transform 1.85s cubic-bezier(0.32, 0.04, 0.18, 1);
            background-color: #2b1508;
            background-image: 
                radial-gradient(ellipse at 50% 35%, rgba(255, 198, 115, 0.15) 0%, rgba(0,0,0,0.58) 85%),
                repeating-linear-gradient(90deg, 
                    rgba(18, 7, 2, 0.34) 0px, 
                    rgba(18, 7, 2, 0.34) 2px, 
                    rgba(78, 37, 14, 0.2) 2px, 
                    rgba(78, 37, 14, 0.2) 5px, 
                    rgba(35, 15, 5, 0.3) 5px, 
                    rgba(35, 15, 5, 0.3) 9px
                ),
                repeating-linear-gradient(178deg, 
                    rgba(12, 4, 1, 0.35) 0px, 
                    transparent 18px, 
                    rgba(95, 48, 17, 0.22) 36px, 
                    rgba(15, 5, 1, 0.4) 54px
                ),
                linear-gradient(180deg, #241005 0%, #3e1e0b 32%, #2a1306 68%, #180902 100%);
            box-shadow: 
                inset 0 0 35px rgba(0,0,0,0.92),
                0 15px 40px rgba(0,0,0,0.85);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 17% 9% 6% 9%;
            overflow: hidden;
        }

        .palace-door-left {
            border-top-left-radius: 312px;
            transform-origin: left center;
            border-right: 2px solid #120702;
            border-left: 4px solid #7c5b24;
            box-shadow: 
                inset -6px 0 15px rgba(0,0,0,0.85),
                inset 4px 0 12px rgba(255, 215, 120, 0.2);
        }

        .palace-door-right {
            border-top-right-radius: 312px;
            transform-origin: right center;
            border-left: 2px solid #593e16;
            border-right: 4px solid #7c5b24;
            box-shadow: 
                inset 6px 0 15px rgba(0,0,0,0.85),
                inset -4px 0 12px rgba(255, 215, 120, 0.2);
        }

        /* 3D Door Edge Thickness */
        .palace-door-left::after {
            content: '';
            position: absolute;
            top: 0;
            right: -18px;
            width: 18px;
            height: 100%;
            background: linear-gradient(180deg, #3a200e, #1d0e05, #472812);
            transform: rotateY(90deg);
            transform-origin: left center;
        }
        .palace-door-right::after {
            content: '';
            position: absolute;
            top: 0;
            left: -18px;
            width: 18px;
            height: 100%;
            background: linear-gradient(180deg, #3a200e, #1d0e05, #472812);
            transform: rotateY(-90deg);
            transform-origin: right center;
        }

        /* Triggered 3D Open State */
        #door-scene-overlay.opening .palace-door-left {
            transform: rotateY(-115deg);
            box-shadow: 35px 0 70px rgba(0,0,0,0.85);
        }
        #door-scene-overlay.opening .palace-door-right {
            transform: rotateY(115deg);
            box-shadow: -35px 0 70px rgba(0,0,0,0.85);
        }

        /* Recessed Carved Wooden Panels inside each Door */
        .door-carved-panel {
            position: relative;
            width: 100%;
            background: radial-gradient(circle at 50% 50%, rgba(76, 38, 15, 0.68) 0%, rgba(20, 8, 2, 0.95) 100%);
            border: 3px solid #96722f;
            outline: 2px solid #1a0b03;
            box-shadow: 
                inset 0 6px 18px rgba(0,0,0,0.95),
                inset 0 -3px 10px rgba(212, 175, 55, 0.28),
                0 3px 6px rgba(0,0,0,0.85),
                0 0 0 5px #231006,
                0 0 0 7px rgba(196, 153, 67, 0.45);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .panel-arch-top {
            height: 28%;
            border-radius: 140px 140px 6px 6px;
        }
        .panel-middle-main {
            height: 41%;
            border-radius: 8px;
        }
        .panel-bottom-base {
            height: 22%;
            border-radius: 6px;
        }

        /* Metallic Brass Stud Strips */
        .brass-stud-row {
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 2px 4px;
            height: 16px;
        }
        .brass-stud {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: radial-gradient(circle at 32% 30%, #fff8d6 0%, #e0b64c 35%, #8a6214 75%, #2b1b03 100%);
            box-shadow: 
                0 3px 5px rgba(0,0,0,0.9),
                inset 0 1px 2px rgba(255,255,255,0.8);
        }

        /* Realistic 3D Sculpted Gold Ring Knockers */
        .knocker-assembly {
            position: absolute;
            top: 51%;
            z-index: 25;
            width: 64px;
            height: 88px;
            display: flex;
            flex-direction: column;
            align-items: center;
            transform: translateZ(14px);
            filter: drop-shadow(0 12px 10px rgba(0,0,0,0.85));
        }
        .knocker-left { right: 10%; }
        .knocker-right { left: 10%; }
        .knocker-backplate {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            background: conic-gradient(from 45deg, #6e4e11, #f3d27a, #8a6418, #fff1ba, #704f10, #d4a843, #6e4e11);
            border: 2px solid #fffae0;
            box-shadow: 
                inset 0 0 10px rgba(0,0,0,0.8),
                0 4px 10px rgba(0,0,0,0.9);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .knocker-pivot {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #ffffff, #ffd86b 45%, #75510c 90%);
            box-shadow: 0 3px 6px rgba(0,0,0,0.9);
        }
        .knocker-ring {
            margin-top: -11px;
            width: 52px;
            height: 52px;
            border-radius: 50%;
            border: 8px solid transparent;
            background: 
                linear-gradient(#2c1609, #2c1609) padding-box,
                linear-gradient(145deg, #fff5c0 0%, #d4af37 35%, #6b4c0e 70%, #f5d77f 100%) border-box;
            box-shadow: 
                0 10px 14px rgba(0,0,0,0.85),
                inset 0 3px 6px rgba(0,0,0,0.75);
            animation: knockerGleam 2.8s infinite ease-in-out;
            transform-origin: top center;
        }
        @keyframes knockerGleam {
            0%, 100% {
                transform: rotateX(0deg);
                filter: drop-shadow(0 0 6px rgba(255, 215, 90, 0.4));
            }
            50% {
                transform: rotateX(14deg);
                filter: drop-shadow(0 0 18px rgba(255, 225, 120, 0.95));
            }
        }

        /* =========================================================
           2. CLASSIC ROYAL EMERALD, GOLD & PARCHMENT STYLING
           ========================================================= */
        .arabesque-bg {
            background-color: #03120b;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(212, 175, 55, 0.16) 0%, transparent 62%),
                url("data:image/svg+xml,%3Csvg width='80' height='80' viewBox='0 0 80 80' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' stroke='%23d4af37' stroke-width='0.6' stroke-opacity='0.11'%3E%3Cpath d='M40 0L50 30L80 40L50 50L40 80L30 50L0 40L30 30Z'/%3E%3Ccircle cx='40' cy='40' r='18'/%3E%3Cpath d='M0 0L20 20M80 0L60 20M0 80L20 60M80 80L60 60'/%3E%3C/g%3E%3C/svg%3E");
        }

        /* Shimmering Gold Foil Text */
        .gold-foil-text {
            background: linear-gradient(135deg, #bf953f 0%, #fcf6ba 25%, #d4af37 50%, #fbf5b7 75%, #9b6c15 100%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: foilShine 6s linear infinite;
        }
        @keyframes foilShine {
            to { background-position: 200% center; }
        }

        /* Deep Emerald & Gold Royal Card */
        .gold-border-card {
            background: linear-gradient(160deg, rgba(8, 41, 27, 0.94) 0%, rgba(3, 18, 11, 0.98) 100%);
            border: 1.5px solid rgba(212, 175, 55, 0.45);
            box-shadow: 
                0 20px 50px rgba(0, 0, 0, 0.75),
                inset 0 0 28px rgba(212, 175, 55, 0.07);
        }

        /* Dark Royal Emerald & Liquid Gold Palace Mihrab Invitation Card (No White!) */
        .emerald-royal-mihrab-card {
            background: 
                radial-gradient(circle at 50% 18%, rgba(212, 175, 55, 0.20) 0%, transparent 55%),
                radial-gradient(circle at 50% 82%, rgba(212, 175, 55, 0.14) 0%, transparent 55%),
                linear-gradient(165deg, #072a1e 0%, #041b12 48%, #02100a 100%);
            color: #fdfaf3;
            border: 2.5px solid #d4af37;
            box-shadow: 
                0 28px 75px rgba(0, 0, 0, 0.92),
                0 0 0 6px #03120b,
                0 0 0 8px rgba(212, 175, 55, 0.55),
                inset 0 0 55px rgba(212, 175, 55, 0.12);
            position: relative;
        }
        .emerald-royal-mihrab-card::before {
            content: '';
            position: absolute;
            inset: 12px;
            border: 1px solid rgba(251, 232, 166, 0.32);
            border-radius: 18px;
            pointer-events: none;
            background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' stroke='%23d4af37' stroke-width='0.5' stroke-opacity='0.08'%3E%3Cpolygon points='50,5 62,38 95,50 62,62 50,95 38,62 5,50 38,38'/%3E%3Ccircle cx='50' cy='50' r='24'/%3E%3C/g%3E%3C/svg%3E");
        }

        /* Majestic Royal Capital Name Typography */
        .royal-couple-name {
            font-family: 'Cormorant Garamond', serif;
            font-weight: 700;
            letter-spacing: 0.04em;
            background: linear-gradient(180deg, #fff9d6 0%, #fbe8a6 30%, #d4af37 65%, #9e7313 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            filter: drop-shadow(0 4px 14px rgba(212, 175, 55, 0.32));
        }
        .royal-drop-cap {
            font-family: 'Cinzel Decorative', serif;
            font-weight: 900;
            font-style: normal;
            display: inline-block;
            background: linear-gradient(135deg, #fffbe0 0%, #fbe8a6 35%, #d4af37 70%, #aa7c11 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            filter: drop-shadow(0 3px 10px rgba(212, 175, 55, 0.5));
        }

        /* Rotating Mandala Ring in Monogram */
        .spin-slow {
            animation: spinMandala 28s linear infinite;
            transform-origin: center;
        }
        @keyframes spinMandala {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Floating Gold Dust Canvas */
        #gold-dust-canvas {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 30;
        }

        /* Custom Scrollbar for Blessings Wall */
        .blessings-scroll::-webkit-scrollbar {
            width: 6px;
        }
        .blessings-scroll::-webkit-scrollbar-track {
            background: rgba(3, 18, 11, 0.6);
            border-radius: 8px;
        }
        .blessings-scroll::-webkit-scrollbar-thumb {
            background: rgba(212, 175, 55, 0.5);
            border-radius: 8px;
        }

        /* =========================================================
           UPGRADE: REAL WOOD, STONE, LIGHT RAYS, LANTERNS, PETALS
           ========================================================= */
        #door-scene-overlay .archway-surround {
            background:
                radial-gradient(circle at 50% 18%, rgba(255, 212, 118, 0.22) 0%, transparent 58%),
                radial-gradient(ellipse 40% 50% at 8% 30%, rgba(255, 170, 60, 0.22), transparent 70%),

        .door-light-rays {
            position: absolute;
            width: 180vmax;
            height: 180vmax;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%) rotate(0deg);
            background: repeating-conic-gradient(from 0deg at 50% 50%, rgba(255,248,215,0) 0deg, rgba(255,248,215,0.20) 4deg, rgba(255,248,215,0) 9deg, rgba(255,248,215,0) 15deg);
            filter: blur(5px);
            opacity: 0;
            z-index: 2;
            pointer-events: none;
            transition: opacity 1.4s ease;
            animation: raysTurn 40s linear infinite;
        }
        #door-scene-overlay.opening .door-light-rays { opacity: 1; }
        @keyframes raysTurn { to { transform: translate(-50%, -50%) rotate(360deg); } }

        /* Hanging palace lanterns (gate + hero) */
        .gate-lantern {
            position: absolute;
            top: 0;
            width: 74px;
            height: 300px;
            z-index: 6;
            transform-origin: 50% 0;
            animation: lanternSwing 4.2s ease-in-out infinite;
            pointer-events: none;
        }
        .gate-lantern.left { left: 2.5vw; }
        .gate-lantern.right { right: 2.5vw; animation-delay: -2.1s; }
        .gate-lantern .lantern-glass { animation: lanternFlicker 2.3s infinite; }
        .gate-lantern::after {
            content: '';
            position: absolute;
            left: 50%;
            top: 62%;
            width: 240px;
            height: 240px;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 200, 90, 0.45), rgba(255, 160, 40, 0.1) 45%, transparent 70%);
            animation: lanternFlicker 2.3s infinite;
        }
        @media (max-width: 760px) { .gate-lantern { display: none; } }
        @keyframes lanternSwing { 0%,100% { transform: rotate(2.4deg); } 50% { transform: rotate(-2.4deg); } }
        @keyframes lanternFlicker { 0%,100% { opacity: 1; } 40% { opacity: 0.82; } 45% { opacity: 0.95; } 70% { opacity: 0.86; } }

        .hero-lanterns { position: relative; height: 0; }
        .hero-lantern {
            position: absolute;
            top: -40px;
            width: 46px;
            transform-origin: 50% 0;
            animation: lanternSwing 4.6s ease-in-out infinite;
            pointer-events: none;
            filter: drop-shadow(0 0 18px rgba(255, 200, 90, 0.55));
        }

        @media (max-width: 639px) {
            .hero-lantern { width: 26px !important; top: -58px !important; }
            .hero-lantern:nth-child(1) { left: 1% !important; }
            .hero-lantern:nth-child(2) { right: 1% !important; }
        }

        /* Scroll reveal */
        .reveal { opacity: 0; transform: translateY(36px) scale(0.985); transition: opacity 1s ease, transform 1s cubic-bezier(0.22, 1, 0.36, 1); }
        .reveal.in { opacity: 1; transform: none; }
        @media (prefers-reduced-motion: reduce) { .reveal { opacity: 1; transform: none; transition: none; } }

        /* Invitation film frame */
        .film-frame {
            position: relative;
            border-radius: 28px;
            padding: 10px;
            background: linear-gradient(135deg, #8c6914, #fbe8a6 30%, #d4af37 50%, #fbe8a6 70%, #8c6914);
            box-shadow: 0 30px 70px rgba(0,0,0,0.8), 0 0 40px rgba(212,175,55,0.25);
        }
        .film-frame video { display: block; width: 100%; border-radius: 20px; background: #03120b; }

        /* Calendar buttons */
        .cal-btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; }

        /* Countdown digit tick */
        .tick { animation: tick 0.5s ease; }
        @keyframes tick { 0% { transform: translateY(-8px); opacity: 0.4; } 100% { transform: none; opacity: 1; } }

        /* Gold sparkles where guests touch */
        .touch-spark { position: fixed; width: 8px; height: 8px; margin: -4px 0 0 -4px; border-radius: 50%; pointer-events: none; z-index: 10001;
            background: radial-gradient(circle, #fffbe6 0%, #fbe8a6 40%, rgba(212,175,55,0) 72%); }

        /* =========================================================
           DOOR HINT: "Touch the doors to open"
           ========================================================= */
        .door-hint {
            position: absolute; left: 50%; bottom: max(4vh, 22px); transform: translateX(-50%);
            z-index: 50; text-align: center; pointer-events: none;
            padding: 12px 24px 13px; border-radius: 999px;
            background: rgba(10, 6, 2, 0.72); border: 1px solid rgba(212, 175, 55, 0.65);
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.25), 0 10px 30px rgba(0,0,0,0.6);
            backdrop-filter: blur(4px);
            white-space: nowrap;
            animation: hintIn 1.2s ease 0.6s both;
            transition: opacity .5s ease;
        }
        #door-scene-overlay.opening .door-hint { opacity: 0; }
        .door-hint-title {
            font-family: 'Cormorant Garamond', serif; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase;
            font-size: clamp(16px, 4.6vw, 20px);
            background: linear-gradient(100deg, #b8892a, #fbe8a6 30%, #fff8dc 40%, #d4af37 60%, #fbe8a6 80%, #b8892a);
            background-size: 250% 100%; -webkit-background-clip: text; background-clip: text; color: transparent;
            animation: hintShine 3.2s linear infinite;
        }
        .door-hint-sub { font-size: 10px; letter-spacing: 0.32em; text-transform: uppercase; color: rgba(232, 222, 200, 0.75); margin-top: 3px; }
        .door-hint-hand {
            position: absolute; left: 50%; top: 50%; z-index: 49; pointer-events: none;
            width: 74px; height: 74px; margin: -37px 0 0 -37px;
            display: flex; align-items: center; justify-content: center;
            font-size: 30px; color: #fff3c4;
            filter: drop-shadow(0 0 10px rgba(255, 220, 130, 0.9));
            animation: handTap 2.4s ease-in-out infinite;
            transition: opacity .4s ease;
        }
        .door-hint-hand::before {
            content: ''; position: absolute; inset: 0; border-radius: 50%;
            border: 2px solid rgba(251, 232, 166, 0.85);
            animation: tapRing 2.4s ease-out infinite;
        }
        #door-scene-overlay.opening .door-hint-hand { opacity: 0; }
        @keyframes hintIn { from { opacity: 0; transform: translate(-50%, 16px); } to { opacity: 1; transform: translate(-50%, 0); } }
        @keyframes hintShine { from { background-position: 0% 0; } to { background-position: 250% 0; } }
        @keyframes handTap { 0%, 100% { transform: translate(14px, 22px) scale(1); } 40% { transform: translate(0, 0) scale(1); } 50% { transform: translate(0, 0) scale(0.86); } 60% { transform: translate(0, 0) scale(1); } }
        @keyframes tapRing { 0%, 45% { transform: scale(0.4); opacity: 0; } 50% { transform: scale(0.5); opacity: 1; } 100% { transform: scale(1.5); opacity: 0; } }

        /* Doors gently "breathe" open a crack, inviting a push */
        #door-scene-overlay:not(.opening) .palace-door-left { animation: doorNudgeL 4.5s ease-in-out 1.5s infinite; }
        #door-scene-overlay:not(.opening) .palace-door-right { animation: doorNudgeR 4.5s ease-in-out 1.5s infinite; }
        @keyframes doorNudgeL { 0%, 70%, 100% { transform: rotateY(0deg); } 80% { transform: rotateY(-7deg); } 90% { transform: rotateY(-1.5deg); } }
        @keyframes doorNudgeR { 0%, 70%, 100% { transform: rotateY(0deg); } 80% { transform: rotateY(7deg); } 90% { transform: rotateY(1.5deg); } }

        /* =========================================================
           ANIMATED CARTOON MOMENT: the couple, hand-drawn in gold
           ========================================================= */
        .story-stage { position: relative; max-width: 440px; margin: 0 auto; }
        .story-svg { width: 100%; height: auto; display: block; overflow: visible; }
        .story-svg .ink {
            stroke: #6b4a0e; stroke-width: 1.8; stroke-linejoin: round; stroke-linecap: round;
            fill-opacity: 0; stroke-dasharray: 1; stroke-dashoffset: 1;
        }
        .story-svg .gl { stroke: #d4af37; fill: none; stroke-width: 2.4; stroke-dasharray: 1; stroke-dashoffset: 1; stroke-linecap: round; stroke-linejoin: round; }
        .story-svg .late { opacity: 0; }
